<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Casa Rosa Studio</title>
  <link rel="icon" href="assets/logo/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
    <!-- Logo colour options in assets/logo/: olive, burgundy, blush -->
    <a class="site-logo" href="index.html"><img src="assets/logo/cr-monogram-olive.png" alt="Casa Rosa Studio"></a>
    <!-- ✏️ Your social links: change each href to your profile -->
    <div class="site-social">
      <a href="https://www.instagram.com/thecasarosastudio/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="https://www.tiktok.com/@casarosastudio" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 2h-3.3v13.2a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9a6.3 6.3 0 1 0 5.3 6.2V8.6a7.9 7.9 0 0 0 4.4 1.4V6.7a4.6 4.6 0 0 1-4.4-4.7z"/></svg>
      </a>
    </div>
  </header>

  <main>
    <section class="contact">
      <!-- ✏️ Form setup: see README.md. Until it is set up, Send opens
           the visitor's email app addressed to data-email below. -->
      <form id="contact-form" action="" method="POST" data-email="hello@example.com">
        <fieldset>
          <legend>Name</legend>
          <div class="field-row">
            <div class="field">
              <label for="first-name">First Name<span>(required)</span></label>
              <input id="first-name" name="first_name" type="text" required autocomplete="given-name">
            </div>
            <div class="field">
              <label for="last-name">Last Name<span>(required)</span></label>
              <input id="last-name" name="last_name" type="text" required autocomplete="family-name">
            </div>
          </div>
        </fieldset>
        <div class="field">
          <label for="email">Email<span>(required)</span></label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="message">Message<span>(required)</span></label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Send</button>
        <p class="form-note" id="form-note" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <span class="footer-left">&copy; Casa Rosa Studio</span>
    <!-- ✏️ Right side of the footer: empty for now -->
    <div class="footer-right"></div>
  </footer>
  <script src="js/contact.js"></script>

</body>
</html>
