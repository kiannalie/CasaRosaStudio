<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Casa Rosa Studio</title>
  <!-- ✏️ Your favicon: add assets/images/favicon.png -->
  <link rel="icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
    <!-- ✏️ Logo: to use an image, replace the text with
         <img src="assets/images/logo.png" alt="Casa Rosa Studio"> -->
    <a class="site-logo" href="index.html">Casa Rosa Studio</a>
    <!-- ✏️ Your Instagram link -->
    <a class="site-social" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
    </a>
  </header>

  <main>
    <section class="contact">
      <!-- ✏️ Form setup: see README.md. Until it is set up, Send opens
           the visitor's email app addressed to data-email below. -->
      <form id="contact-form" action="" method="POST" data-email="hello@example.com">
        <fieldset>
          <legend>Name</legend>
          <div class="field-row">
            <div class="field">
              <label for="first-name">First Name<span>(required)</span></label>
              <input id="first-name" name="first_name" type="text" required autocomplete="given-name">
            </div>
            <div class="field">
              <label for="last-name">Last Name<span>(required)</span></label>
              <input id="last-name" name="last_name" type="text" required autocomplete="family-name">
            </div>
          </div>
        </fieldset>
        <div class="field">
          <label for="email">Email<span>(required)</span></label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="message">Message<span>(required)</span></label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit">Send</button>
        <p class="form-note" id="form-note" role="status"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">&copy; Casa Rosa Studio</footer>
  <script src="js/contact.js"></script>

</body>
</html>
